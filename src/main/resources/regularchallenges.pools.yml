config-version: 1

pools:
  # These are examples of the "capture_pokemon" challenge. Called when capturing Pokemon in or out of battle.
  capture_pokemon_example: # Pool ID
    very_specific_grass_pokemon: # Challenge Template ID
      weight: 1
      type: capture_pokemon
      # This can be converted into a list for multiple permissible options.
      properties: "hasType=fire minLevel=10 timeOfDay=0/12000 inBiome=minecraft:plains pokeball=cobblemon:master_ball"
      amount: 30
      rewards:
        - give {player} diamond
      menu:
        board_view:
          type: cobblemon:poke_ball
          hide-tooltip: true
          custom-model-data: 0
          display-name: "<yellow>Capture {amount} Pokemon!"
          lore:
            - ""
            - "<gold>Capture {amount} level 10+ fire type Pokemon, during the day, in a plains biome, using a masterball."
            - ""
            - "<aqua>{total_played_completed} <dark_aqua>players have beaten this challenge so far!"
            - "<gold>Progress: {self_progress}/{amount} Captured!"
    water_pokemon:
      weight: 1
      type: capture_pokemon
      # This can be converted into a list for multiple permissible options.
      properties: "hasType=water minLevel=10"
      amount: 30
      rewards:
        - give {player} diamond
      menu:
        board_view:
          type: cobblemon:poke_ball
          hide-tooltip: true
          custom-model-data: 0
          display-name: "<yellow>Capture {amount} Pokemon!"
          lore:
            - ""
            - "<gold>Capture {amount} level 10+ water type Pokemon!"
            - ""
            - "<aqua>{total_played_completed} <dark_aqua>players have beaten this challenge so far!"
            - "<gold>Progress: {self_progress}/{amount} Captured!"
    fire_pokemon:
      weight: 1
      type: capture_pokemon
      # This can be converted into a list for multiple permissible options.
      properties: "hasType=grass minLevel=10"
      amount: 30
      rewards:
        - give {player} diamond
      menu:
        board_view:
          type: cobblemon:poke_ball
          hide-tooltip: true
          custom-model-data: 0
          display-name: "<yellow>Capture {amount} Pokemon!"
          lore:
            - ""
            - "<gold>Capture {amount} level 10+ grass type Pokemon!"
            - ""
            - "<aqua>{total_played_completed} <dark_aqua>players have beaten this challenge so far!"
            - "<gold>Progress: {self_progress}/{amount} Captured!"

  # These are examples of the "break_block" challenge. Called after a player breaks a block.
  break_block_example:
    mine_any_blocks:
      weight: 1
      type: break_block
      amount: 256
      rewards:
        - give {player} diamond
      menu:
        board_view:
          type: minecraft:diamond_pickaxe
          display-name: "<yellow>Break Any Block!"
          lore:
            - ""
            - "<gold>Break any block!"
            - ""
            - "<aqua>{total_played_completed} <dark_aqua>players have beaten this challenge so far!"
            - "<gold>Progress: {self_progress}/{amount} Broken!"
    mine_diamond_ore:
      weight: 1
      type: break_block
      # This can be converted into a list for multiple permissible options.
      properties: "minecraft:diamond_ore"
      ignore-silk-touch: true # If set to true, silk touch tools will not be included.
      amount: 256
      rewards:
        - give {player} diamond
      menu:
        board_view:
          type: minecraft:diamond_pickaxe
          display-name: "<yellow>Break Diamond Ore!"
          lore:
            - ""
            - "<gold>Break diamond ore without using Silk Touch!"
            - ""
            - "<aqua>{total_played_completed} <dark_aqua>players have beaten this challenge so far!"
            - "<gold>Progress: {self_progress}/{amount} Broken!"

  # These are examples of the "win_battle" challenge. These are called for all victors of a battle against all losers.
  win_battle_example:
    win_very_specific_battle:
      weight: 1
      type: win_battle
      amount: 1
      battle-type: "wild/npc/player" # The enemy must be at least one of these
      # This can be converted into a list for multiple permissible options.
      self-properties: "hasType=water levelRange=0/20" # The player's team MUST have one Pokemon matching this
      # This can be converted into a list for multiple permissible options.
      enemy-properties: "hasType=fire levelRange=0/20" # Any enemy Pokemon MUST have one Pokemon matching this
      rewards:
        - give {player} diamond
      menu:
        board_view:
          type: cobblemon:master_ball
          hide-tooltip: true
          display-name: "<yellow>Win a Battle!"
          lore:
            - ""
            - "<gold>  Win a battle using a water Pokemon below"
            - "<gold>level 20 against a fire type below level 20!"
            - ""
            - "<aqua>{total_played_completed} <dark_aqua>players have beaten this challenge so far!"
            - "<gold>Progress: {self_progress}/{amount} Defeated!"

  # These are examples of the "evolve_pokemon" challenge. These are called when a player's Pokemon evolves.
  evolve_pokemon_example:
    evolve_very_specific:
      weight: 1
      type: evolve_pokemon
      # This can be converted into a list for multiple permissible options.
      post-evolution-properties: "raichu"
      rewards:
        - give {player} diamond
      menu:
        board_view:
          type: cobblemon:thunder_stone
          hide-tooltip: true
          display-name: "<yellow>Evolve a Raichu!"
          lore:
            - ""
            - "<gold>Evolve your Pikachu into a Raichu!"
            - ""
            - "<aqua>{total_played_completed} <dark_aqua>players have beaten this challenge so far!"
            - "<gold>Progress: {self_progress}/{amount} Defeated!"

