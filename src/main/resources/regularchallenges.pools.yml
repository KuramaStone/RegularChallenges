  # These are examples of the "playtime" challenge. This tracks how many seconds the player has played
  playtime_example:
    playtime_challenge:
      weight: 1
      type: playtime
      amount: 3600 # One hour
      menu:
        board_view:
          type: minecraft:clock
          display-name: "<yellow>Play One Hour!"
          lore:
            - ""
            - "<gold>Play for one hour!"
            - ""
