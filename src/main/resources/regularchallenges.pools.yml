      weight: 1
      type: harvest_apricorn
      amount: 64
      # This can be converted into a list for multiple permissible options.
      apricorn-type: pink
      menu:
        board_view:
          type: cobblemon:pink_apricorn
          display-name: "<light_purple>Harvest Pink Apricorns!"
          lore:
            - ""
            - "<gold>Harvest {amount} Apricorns!"
