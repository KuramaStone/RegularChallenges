  # These are examples of the "item_on_pokemon" challenge. This is for item usage on a Pokemon.
  item_on_pokemon_example:
    use_oranberry_any_pokemon:
      weight: 1
      type: item_on_pokemon
      # This can be converted into a list for multiple permissible options.
      item: cobblemon:oran_berry
      amount: 1 # One hour
      menu:
        board_view:
          type: cobblemon:oran_berry
          hide-tooltip: true
          display-name: "<yellow>Feed Berry"
          lore:
            - ""
            - "<gold>Feed an Oran Berry to your Pokemon by hand!"
            - ""
            - "<aqua>{total_played_completed} <dark_aqua>players have beaten this challenge so far!"
            - "<gold>Progress: {self_progress}/{amount} Fed!"
    use_sitrusberry_on_pikachu:
      weight: 1
      type: item_on_pokemon
      # This can be converted into a list for multiple permissible options.
      item: cobblemon:sitrus_berry
      # This can be converted into a list for multiple permissible options.
      properties:
        - "pikachu levelRange=0/100"
        - "raichu levelRange=0/100"
      amount: 1
      menu:
        board_view:
          type: cobblemon:sitrus_berry
          hide-tooltip: true
          display-name: "<yellow>Feed Pikachu!"
          lore:
            - ""
            - "<gold>Feed a Sitrus Berry to Pikachu!"
            - ""
            - "<aqua>{total_played_completed} <dark_aqua>players have beaten this challenge so far!"
            - "<gold>Progress: {self_progress}/{amount} Fed!"
    consume_redstone_torch_on_pikachu:
      weight: 1
      type: item_on_pokemon
      item: minecraft:redstone_torch
      # This can be converted into a list for multiple permissible options.
      properties: "pikachu levelRange=0/100"
      force-consume: true # If true, then this will forcefully consume the item.
      amount: 16
      menu:
        board_view:
          type: minecraft:redstone_torch
          display-name: "<yellow>Feed Pikachu!"
          lore:
            - ""
            - "<gold>Feed Pikachu some redstone torches!"
            - ""
